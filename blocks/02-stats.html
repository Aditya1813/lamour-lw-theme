<!-- ===========================================================
     BLOCK 02 — Stats strip
     Figures count up once on entry. The literal text inside each
     span is the fallback, so it must already read correctly if the
     script never runs.

     RULE: never put a graduate/student count in here. Use course
     structure figures only — they are verifiable from the syllabus.
     Numbers below are the authoritative Pro Plus figures.
     =========================================================== -->
<section class="la-block" data-la-reveal>
  <div class="la-inner">
    <div class="la-head">
      <p class="la-eyebrow">The Pro Plus programme</p>
      <h2 class="la-display la-t-h2">What eight weeks actually contains</h2>
    </div>
    <div class="la-stats" data-la-reveal-group>
      <div class="la-stat">
        <span class="la-stat__figure" data-la-count="8">8</span>
        <span class="la-stat__label">weeks, full-time</span>
      </div>
      <div class="la-stat">
        <span class="la-stat__figure" data-la-count="52">52</span>
        <span class="la-stat__label">teaching days</span>
      </div>
      <div class="la-stat">
        <span class="la-stat__figure" data-la-count="159" data-la-suffix="h">159h</span>
        <span class="la-stat__label">of timetabled instruction</span>
      </div>
    </div>
  </div>
</section>
