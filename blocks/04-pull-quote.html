<!-- ===========================================================
     BLOCK 04 — Pull quote
     Use a real, attributable quote only. Name + role, no stock
     testimonials, no invented students.
     =========================================================== -->
<section class="la-block la-ink" style="background:var(--la-ink);color:var(--la-paper);" data-la-reveal>
  <div class="la-inner la-inner--narrow la-quote la-on-dark">
    <figure>
      <blockquote class="la-display">I came in able to do my own face. I left able to do a call sheet.</blockquote>
      <figcaption>
        <cite>REPLACE — student name</cite>
        <span class="la-quote__role">REPLACE — course and year</span>
      </figcaption>
    </figure>
  </div>
</section>
